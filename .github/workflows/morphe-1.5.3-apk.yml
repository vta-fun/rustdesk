# Builds only the Dart snapshot for 1.5.3: the payload of the bundle is
# lib/arm64-v8a/libapp.so, and nothing in it comes from the Rust side.
name: RustDesk 1.5.3 payload snapshot

on:
  workflow_dispatch:
  push:
    branches: [codex/morphe-1.5.3]
    paths:
      - .github/workflows/morphe-1.5.3-apk.yml
      - flutter/lib/mobile/pages/settings_page.dart

permissions:
  contents: read

env:
  ANDROID_FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"

jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml

  snapshot:
    needs: bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Apply the upstream Flutter SDK patch
        run: |
          sdk_root="$(dirname "$(dirname "$(command -v flutter)")")"
          git -C "$sdk_root" apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: bridge-artifact

      # app/build.gradle runs `cargo metadata` while Gradle configures, but the
      # native libraries are not built here: libapp.so does not depend on them.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build the APK without native libraries
        working-directory: flutter
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          flutter pub get
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' android/gradle.properties
          sed -i 's/signingConfigs.release/signingConfigs.debug/g' android/app/build.gradle
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Extract libapp.so
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          unzip -o -j flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            'lib/arm64-v8a/libapp.so' -d "$RUNNER_TEMP/payload"
          ls -l "$RUNNER_TEMP/payload"
          sha256sum "$RUNNER_TEMP/payload/libapp.so"

      - name: Upload libapp.so
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdesk-1.5.3-libapp
          path: ${{ runner.temp }}/payload/libapp.so
          if-no-files-found: error
          retention-days: 14

      - name: Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdesk-1.5.3-dart-only-apk
          path: flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
