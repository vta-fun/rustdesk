# Builds the patch bundle and proves it applies to the official RustDesk APK.
name: RustDesk Morphe bundle

on:
  workflow_dispatch:
  push:
    branches: [codex/morphe-ime-favorites]
    paths:
      - .github/workflows/morphe-bundle.yml
      - morphe-rustdesk/**
  pull_request:
    paths:
      - .github/workflows/morphe-bundle.yml
      - morphe-rustdesk/**

permissions:
  contents: read

env:
  RUSTDESK_APK_URL: https://github.com/rustdesk/rustdesk/releases/download/1.5.1/rustdesk-1.5.1-aarch64-signed.apk

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the patch bundle
        working-directory: morphe-rustdesk
        run: ./gradlew --no-daemon :patches:buildAndroid

      - name: Download the official APK
        run: curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/rustdesk.apk" "$RUSTDESK_APK_URL"

      - name: Apply the bundle to the official APK
        run: |
          bundle="$(ls morphe-rustdesk/patches/build/libs/*.mpp)"
          java -jar morphe-rustdesk/patches/build/tools/morphe-desktop-2.0.0-all.jar patch \
            --unsigned \
            --exclusive \
            -e "Fix Japanese soft keyboard input" \
            -e "Settings backup and restore" \
            -p "$bundle" \
            "$RUNNER_TEMP/rustdesk.apk" \
            -o "$RUNNER_TEMP/patched.apk" \
            -r "$RUNNER_TEMP/result.json"
          grep --quiet '"success":true' "$RUNNER_TEMP/result.json"

      - name: Check that the patched APK keeps the official native libraries
        run: |
          for lib in libapp.so librustdesk.so libflutter.so; do
            original="$(unzip -p "$RUNNER_TEMP/rustdesk.apk" "lib/arm64-v8a/$lib" | sha256sum | cut -d' ' -f1)"
            patched="$(unzip -p "$RUNNER_TEMP/patched.apk" "lib/arm64-v8a/$lib" | sha256sum | cut -d' ' -f1)"
            if [ "$original" != "$patched" ]; then
              echo "::error::$lib differs from the official APK"
              exit 1
            fi
          done

      - name: Check that the hooks reached the patched APK
        run: |
          unzip -p "$RUNNER_TEMP/patched.apk" classes3.dex | grep --quiet --text "rustdesk_connection_backup"
          unzip -p "$RUNNER_TEMP/patched.apk" classes4.dex | grep --quiet --text "ImeEditReplayer"
          unzip -p "$RUNNER_TEMP/patched.apk" AndroidManifest.xml | grep --quiet --text "BackupLauncher"

      - name: Upload the patch bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rustdesk-patches
          path: morphe-rustdesk/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
